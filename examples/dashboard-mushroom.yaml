# Dashboard completo. Requiere Mushroom 5.x; no necesita card-mod ni temas.
# Sustituye TODAS las entidades sensor.mi_contrato_* por las reales.
# Guía: docs/dashboards.md
title: Luz en Cifras
views:
- title: Resumen
  path: resumen
  icon: mdi:lightning-bolt
  type: sections
  max_columns: 2
  header:
    card:
      type: markdown
      text_only: true
      content: |-
        # Tu electricidad, en claro
        Lo que llevas de factura y dónde se consume.
  sections:
  - type: grid
    cards:
    - type: markdown
      content: |-
        ## Factura estimada
        {% set importe = states('sensor.mi_contrato_factura_actual_estimada') %}
        {% if is_number(importe) %}
        # {{ '{:.2f}'.format(importe | float) | replace('.', ',') }} €
        {% else %}
        # Pendiente de datos
        {% endif %}
        Del ciclo actual · incluye los impuestos configurados.
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-entity-card
      entity: sensor.mi_contrato_energia_del_periodo
      name: Consumo
      icon: mdi:lightning-bolt
      tap_action:
        action: more-info
      icon_color: teal
    - type: custom:mushroom-entity-card
      entity: sensor.mi_contrato_dias_del_periodo
      name: Días calculados
      icon: mdi:calendar-range
      tap_action:
        action: more-info
      icon_color: grey
    - type: custom:mushroom-template-card
      entity: sensor.mi_contrato_calidad_de_los_datos
      primary: |-
        {% set calidad = states(entity) %}
        {% if calidad == 'complete' %}Datos completos
        {% elif calidad == 'partial' %}Medición parcial
        {% else %}Revisa la medición{% endif %}
      secondary: |-
        {% set calidad = states(entity) %}
        {% if calidad == 'complete' %}
          Completo para el tramo registrado. Sigue siendo una estimación.
        {% elif calidad == 'partial' %}
          Puede faltar consumo o estar estimado desde W/kW. Toca para ver los avisos.
        {% else %}
          {{ state_attr(entity, 'error') or 'Esperando datos válidos. Toca para ver los avisos.' }}
        {% endif %}
      icon: mdi:information-outline
      color: |-
        {% if is_state(entity, 'complete') %}teal
        {% elif is_state(entity, 'partial') %}amber
        {% else %}red{% endif %}
      multiline_secondary: true
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Dónde se consume
      heading_style: title
      icon: mdi:home-lightning-bolt-outline
    - type: custom:mushroom-template-card
      entity: sensor.mi_contrato_casa_energia
      primary: Casa
      secondary: |-
        {% set energia = states(entity) %}
        {% set coste = states('sensor.mi_contrato_casa_coste_de_energia') %}
        {% if is_number(energia) %}{{ '{:.3f}'.format(energia | float) | replace('.', ',') }} kWh{% else %}Consumo pendiente{% endif %}
        · {% if is_number(coste) %}{{ '{:.2f}'.format(coste | float) | replace('.', ',') }} € de energía{% else %}Coste pendiente{% endif %}
      entity_id:
      - sensor.mi_contrato_casa_energia
      - sensor.mi_contrato_casa_coste_de_energia
      icon: mdi:home-outline
      color: teal
      multiline_secondary: true
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      entity: sensor.mi_contrato_coche_energia
      primary: Coche
      secondary: |-
        {% set energia = states(entity) %}
        {% set coste = states('sensor.mi_contrato_coche_coste_de_energia') %}
        {% if is_number(energia) %}{{ '{:.3f}'.format(energia | float) | replace('.', ',') }} kWh{% else %}Consumo pendiente{% endif %}
        · {% if is_number(coste) %}{{ '{:.2f}'.format(coste | float) | replace('.', ',') }} € de energía{% else %}Coste pendiente{% endif %}
      entity_id:
      - sensor.mi_contrato_coche_energia
      - sensor.mi_contrato_coche_coste_de_energia
      icon: mdi:car-electric-outline
      color: blue
      multiline_secondary: true
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      text_only: true
      content: Los importes de cada grupo corresponden solo a energía, sin impuestos. En **Desglose**
        puedes consultar el resto de la factura.
- title: Desglose
  path: desglose
  icon: mdi:receipt-text-outline
  type: sections
  max_columns: 2
  header:
    card:
      type: markdown
      text_only: true
      content: |-
        # De qué está hecha la factura
        Potencia y cargos diarios calculados hasta hoy incluido.
  sections:
  - type: grid
    cards:
    - type: entities
      title: Conceptos del contrato
      show_header_toggle: false
      entities:
      - entity: sensor.mi_contrato_coste_de_energia
        name: Energía sin impuestos
      - entity: sensor.mi_contrato_coste_de_potencia
        name: Potencia contratada
      - entity: sensor.mi_contrato_otros_cargos
        name: Alquiler y otros cargos
      - entity: sensor.mi_contrato_descuentos
        name: Descuentos
      - entity: sensor.mi_contrato_compensacion_de_excedentes
        name: Compensación de excedentes
      - entity: sensor.mi_contrato_impuesto_electrico
        name: Impuesto eléctrico
      - entity: sensor.mi_contrato_iva
        name: IVA
      - entity: sensor.mi_contrato_factura_actual_estimada
        name: Total estimado
    - type: entities
      title: Estado de la medición
      show_header_toggle: false
      entities:
      - entity: sensor.mi_contrato_calidad_de_los_datos
        name: Calidad · toca para ver los avisos
  - type: grid
    cards:
    - type: history-graph
      title: Evolución del total estimado · 7 días
      hours_to_show: 168
      entities:
      - entity: sensor.mi_contrato_factura_actual_estimada
        name: Factura estimada
    - type: markdown
      text_only: true
      content: El total se reinicia al cambiar de ciclo. Esta gráfica muestra la estimación acumulada,
        no el gasto diario. Los primeros días solo contienen datos desde que empezaste a medir.
