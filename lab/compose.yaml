# Development fixture only; this is not the installation method for the integration.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
    container_name: luz-en-cifras-ha-lab
    restart: "no"
    user: "1000:1000"
    entrypoint: ["python3", "-m", "homeassistant", "--config", "/config"]
    cpus: 1
    mem_limit: 1536m
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - ./config:/config
      - ../source/custom_components:/config/custom_components:ro
    environment:
      TZ: Europe/Madrid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
